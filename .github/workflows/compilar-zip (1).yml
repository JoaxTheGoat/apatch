# Compila um projeto Android a partir de um arquivo .zip colocado na pasta "zips/" do repositório.
#
# COMO USAR
#   1. No GitHub: repositório > Add file > Upload files > arraste o .zip para a pasta "zips/"
#      (digite zips/ no caminho se a pasta ainda não existir) > Commit changes.
#      -> O build começa sozinho.
#   2. Ou, para escolher manualmente: aba Actions > "Compilar ZIP" > Run workflow
#      (a "janela" com as opções abaixo).
#   3. Ao terminar, baixe o APK em "Artifacts" na página do run.
#
# O ZIP pode ter o projeto na raiz ou dentro de uma pasta (ex.: EdgeIslandCore/...).

name: Compilar ZIP

on:
  push:
    paths:
      - "zips/**"
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Caminho do ZIP no repositório (vazio = ZIP mais recente em zips/)"
        required: false
        default: ""
      gradle_task:
        description: "Tarefa do Gradle"
        required: false
        default: "assembleDebug"
      gradle_version:
        description: "Versão do Gradle (usada só se o projeto não tiver gradlew)"
        required: false
        default: "8.13"
      android_platform:
        description: "Plataforma do Android SDK (número do compileSdk)"
        required: false
        default: "36"
      build_tools:
        description: "Versão dos build-tools"
        required: false
        default: "36.0.0"

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      IN_ZIP: ${{ inputs.zip_path }}
      IN_TASK: ${{ inputs.gradle_task || 'assembleDebug' }}
      IN_GRADLE: ${{ inputs.gradle_version || '8.13' }}
      IN_PLATFORM: ${{ inputs.android_platform || '36' }}
      IN_BUILD_TOOLS: ${{ inputs.build_tools || '36.0.0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Localizar o ZIP
        run: |
          set -euo pipefail
          if [ -n "${IN_ZIP}" ]; then
            ZIP="${IN_ZIP}"
          else
            ZIP=""; BEST=0
            shopt -s nullglob
            for f in zips/*.zip zips/**/*.zip; do
              t=$(git log -1 --format=%ct -- "$f" || echo 0)
              if [ "${t:-0}" -ge "$BEST" ]; then BEST="${t:-0}"; ZIP="$f"; fi
            done
          fi
          if [ -z "${ZIP}" ] || [ ! -f "${ZIP}" ]; then
            echo "::error::Nenhum ZIP encontrado. Coloque um arquivo .zip na pasta zips/ ou informe o caminho."
            exit 1
          fi
          echo "ZIP selecionado: ${ZIP}"
          echo "ZIP_FILE=${ZIP}" >> "$GITHUB_ENV"

      - name: Extrair e localizar o projeto
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/_projeto"
          rm -rf "$DEST"; mkdir -p "$DEST"
          unzip -q "$ZIP_FILE" -d "$DEST"
          SETTINGS=$(find "$DEST" -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::O ZIP não contém settings.gradle(.kts) até 3 níveis de profundidade."
            exit 1
          fi
          ROOT=$(dirname "$SETTINGS")
          echo "Raiz do projeto: $ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          if [ -f "$ROOT/gradlew" ]; then
            chmod +x "$ROOT/gradlew"
            echo "HAS_WRAPPER=true" >> "$GITHUB_ENV"
          else
            echo "HAS_WRAPPER=false" >> "$GITHUB_ENV"
          fi

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Android SDK (já vem no runner)
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"
          fi
          [ -n "$SDKM" ] || { echo "::error::sdkmanager não encontrado em $SDK_ROOT"; exit 1; }
          echo "Usando $SDKM"
          yes | "$SDKM" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK_ROOT" "platforms;android-${IN_PLATFORM}" "build-tools;${IN_BUILD_TOOLS}"

      - name: Gradle
        if: env.HAS_WRAPPER == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle_version || '8.13' }}

      - name: Compilar
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          if [ "$HAS_WRAPPER" = "true" ]; then
            ./gradlew "$IN_TASK" --stacktrace
          else
            gradle "$IN_TASK" --stacktrace
          fi

      - name: Reunir os APKs
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/_saida"
          find "$PROJECT_ROOT" -path '*/build/outputs/*' \( -name '*.apk' -o -name '*.aab' \) -exec cp -v {} "$GITHUB_WORKSPACE/_saida/" \;
          if [ -z "$(ls -A "$GITHUB_WORKSPACE/_saida")" ]; then
            echo "::error::Build terminou, mas nenhum APK/AAB foi encontrado (tarefa '$IN_TASK' gera APK?)."
            exit 1
          fi
          {
            echo "### Build concluído"
            echo "ZIP: \`$ZIP_FILE\`"
            echo "Tarefa: \`$IN_TASK\`"
            echo
            ls -lh "$GITHUB_WORKSPACE/_saida" | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-compilado
          path: _saida/*
          if-no-files-found: error

      - name: Publicar relatórios (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-erro
          path: |
            _projeto/**/build/reports/
          if-no-files-found: ignore
